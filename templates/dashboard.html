<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Personal Finance Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Top Navigation Header -->
<header class="bg-[#111827] border-b border-gray-800 px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-50">
    <div class="flex items-center space-x-3">
        <div class="bg-emerald-500 text-gray-900 font-bold p-2 rounded-xl flex items-center justify-center shadow-lg">
            ₹
        </div>
        <div>
            <div class="flex items-center space-x-2">
                <h1 class="text-lg font-bold tracking-wide">FinEnterprise</h1>
                <span class="bg-gray-800 text-emerald-400 border border-emerald-500/30 text-[10px] font-semibold px-1.5 py-0.5 rounded">V8</span>
            </div>
            <p class="text-[11px] text-gray-400 uppercase tracking-widest font-medium">ENTERPRISE</p>
        </div>
    </div>

    <div class="flex items-center space-x-3">
        <!-- Settings Toggle Button -->
        <button onclick="toggleSettingsModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-2.5 rounded-xl transition shadow border border-gray-700">
            ⚙️
        </button>

        {% if user_email %}
            <!-- Logged In State: User Badge & Logout -->
            <div class="bg-emerald-600 text-white w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm shadow">
                {{ user_name[0] | upper if user_name else 'U' }}
            </div>
            <form action="/logout" method="POST" class="inline">
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow">
                    Logout
                </button>
            </form>
        {% else %}
            <!-- Public / Guest State: Google Login Button -->
            <a href="/login/google" class="bg-white hover:bg-gray-100 text-gray-900 text-xs font-bold px-4 py-2.5 rounded-xl transition shadow flex items-center space-x-2">
                <span>🔐</span>
                <span>Login with Google</span>
            </a>
        {% endif %}

        <!-- Hamburger Menu Button -->
        <button onclick="toggleSidebar()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-2.5 rounded-xl transition shadow border border-gray-700">
            ☰
        </button>
    </div>
</header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-lg">
            <h2 class="text-2xl font-semibold mb-2">Dashboard Overview</h2>
            <p class="text-gray-400">You are successfully logged in and authenticated via Google OAuth.</p>
        </div>
    </main>
</body>
</html>
