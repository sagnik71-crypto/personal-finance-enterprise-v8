<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Personal Finance Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-400">Personal Finance Enterprise</h1>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-gray-300">Welcome!</span>
            <form action="/logout" method="POST">
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm transition">Logout</button>
            </form>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-lg">
            <h2 class="text-2xl font-semibold mb-2">Dashboard Overview</h2>
            <p class="text-gray-400">You are successfully logged in and authenticated via Google OAuth.</p>
        </div>
    </main>
</body>
</html>
